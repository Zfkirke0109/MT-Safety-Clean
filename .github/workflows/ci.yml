name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMPDIR: /tmp/mt-ci-build
      MT_OUTPUT_DIR: /tmp/mt-ci-artifacts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up a JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache reviewed toolchain archives
        id: toolchain-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/mt-ci-build/mt-safety-build/toolchain
          key: mt-toolchain-${{ runner.os }}-${{ hashFiles('tools/toolchain-lock.json') }}

      # GitHub cache versions include the original path, so restore the old path explicitly.
      - name: Restore historical toolchain cache as an input-availability fallback
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/mt-safety-build/toolchain
          key: mt-toolchain-r8-8.9.35-platform30

      - name: Verify and stage available MT API cache receipts
        id: api-cache-import
        run: python3 tools/cached_api_receipts.py /tmp/mt-ci-build/mt-safety-build/toolchain /tmp/mt-safety-build/toolchain /tmp/mt-ci-input-receipts

      - name: Compile and test
        run: bash tools/build.sh test

      - name: Package the plugin separately from the checked-in artifact
        id: package
        run: bash tools/build.sh package

      - name: Verify package reproducibility
        run: |
          cp "$MT_OUTPUT_DIR/mt-safety-scanner.mtp" /tmp/first-build.mtp
          bash tools/build.sh package
          cmp /tmp/first-build.mtp "$MT_OUTPUT_DIR/mt-safety-scanner.mtp"

      - name: Check the rule reference is up to date
        run: |
          bash tools/build.sh docs
          git diff --exit-code -- docs/DETECTION-RULES.md

      - name: Compare every actual committed member including all DEX bytes
        run: bash tools/build.sh verify-package dist/mt-safety-scanner.mtp "$MT_OUTPUT_DIR/mt-safety-scanner.mtp"

      # A deliberately stale checked-in artifact must not hide the fresh build needed to synchronize it.
      - name: Upload newly built plugin and verified receipts
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mt-safety-scanner-mtp
          path: /tmp/mt-ci-artifacts/*
          if-no-files-found: error

      - name: Reverify available MT API bytes after the build
        if: always()
        id: api-receipts
        run: python3 tools/cached_api_receipts.py /tmp/mt-ci-build/mt-safety-build/toolchain /tmp/mt-safety-build/toolchain /tmp/mt-ci-input-receipts

      - name: Upload only verified cached MT API input bytes
        if: always() && steps.api-receipts.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-input-receipt
          path: |
            /tmp/mt-ci-input-receipts/mt-api.aar
            /tmp/mt-ci-input-receipts/mt-plugin-api.jar
          if-no-files-found: warn
